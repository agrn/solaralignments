<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1.0, width=device-width" />
    <title>Solar alignments</title>
    <link rel="stylesheet" href="leaflet/leaflet.css" />
    <script src="leaflet/leaflet.js"></script>
    <script src="sundownjs.bc.js"></script>
    <style>
html, body {
    margin: 0;
    padding: 0;
}

.leaflet-container {
    height: 100vh;
    width: 100vw;
}

form {
    background-color: #fff;
    padding: 5px;
}
    </style>
  </head>
  <body>
    <main>
      <form id="form">
        <div>
          <div>
            <label for="date">Date</label>
            <input type="date" name="date" id="date" required />
            <button id="today">Today</button>
          </div>
        </div>
        <fieldset>
          <legend>Target</legend>
          <div>
            <label for="preset">Preset</label>
            <select name="preset" id="preset">
              <option></option>
            </select>
          </div>
          <div>
            <label for="longitude">Longitude (°)</label>
            <input type="number" name="longitude" id="longitude" step="any" required /><br />
          </div>
          <div>
            <label for="latitude">Latitude (°)</label>
            <input type="number" name="latitude" id="latitude" step="any" required /><br />
          </div>
          <div>
            <label for="altitude">Target altitude (m)</label>
            <input type="number" name="altitude" id="altitude" step="1" required /><br />
          </div>
        </fieldset>
        <fieldset>
          <legend>Observer</legend>
          <div>
            <label for="observer">Observer altitude (m)</label>
            <input type="number" name="observer" id="observer" step="1" required /><br />
          </div>
          <div>
            <label for="distance">Distance (km)</label>
            <input type="number" name="distance" id="distance" required /><br />
         </div>
         <div>
            <label for="lowest">Lowest (°)</label>
            <input type="number" name="lowest" id="lowest" step="any" required /><br />
          </div>
          <div>
            <label for="highest">Highest (°)</label>
            <input type="number" name="highest" id="highest" step="any" required /><br />
          </div>
        </fieldset>
        <div>
          <div>
            <input type="submit" value="Find alignments" />
            <input type="checkbox" name="pin" id="pin" />
            <label for="pin">Select place on the map</label>
          </div>
        </div>
      </form>
      <div id="map"></div>
    </main>
    <script>
      const map = L.map('map').setView([42.937056, 0.141277], 13);

      L.tileLayer('https://b.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; Data from <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>; map tiles from <a href="https://www.openstreetmap.fr/mentions-legales/">OpenStreetMap France</a>'
      }).addTo(map);

      L.Control.Parameters = L.Control.extend({
          onAdd: function(map) {
              var orig = document.getElementById("form");
              var form = orig.cloneNode(true);

              L.DomEvent.on(form, 'click', L.DomEvent.stopPropagation);
              orig.remove();

              return form;
          },

          onRemove: function(map) {}
      });

      (new L.Control.Parameters({ position: 'topright' })).addTo(map);

      var linesGroup = L.layerGroup().addTo(map);
      var pinGroup = L.layerGroup().addTo(map);

      var saved_loc = null;

      function updatePin(lat, lng) {
          pinGroup.clearLayers();
          L.marker([lat, lng]).addTo(pinGroup);
      }

      function noAlignmentsFound() {
          linesGroup.clearLayers();
          alert("No alignments found (no sunrise or sunset at the given date)");
      }

      function displayAlignments(lat, lng, found) {
          linesGroup.clearLayers();

          var lines = found.map((entry) => {
              var lat2 = entry[3][1];
              var lng2 = entry[3][2];

              var line = L.polyline([[lat, lng], [lat2, lng2]], {color: "red"}).addTo(linesGroup);
              line.bindPopup(entry[1].toLocaleTimeString() + "; alt=" + entry[2][1] + "°");
              return line
          });

          if (saved_loc != (lat, lng)) {
              map.fitBounds(lines[0].getBounds());
              saved_loc = (lat, lng);
          }
      }

      map.on('click', (e) => {
          alignment.handleMapClickEvent(e.latlng.lat, e.latlng.lng);
          return true;
      });

      sundownjs.setup({});
    </script>
  </body>
</html>
